server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para melhorar performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Proxy reverso: encaminha /api/* para o backend (service name do Docker Compose)
    # O trailing slash em proxy_pass remove o prefixo /api antes de repassar.
    # Exemplo: GET /api/todos → GET http://backend:5000/todos
    location /api/ {
        proxy_pass         http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Suporte ao Vue Router em modo history (HTML5 History API)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
